  build-windows-msvc-amd64:
    name: Build Windows amd64 (MSVC)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          toolchain: 1.89.0-x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        id: python_setup
        with:
          python-version: "3.11"
          architecture: "x64"
      - name: Install pinned native LLVM SDK
        shell: pwsh
        run: ./tools/provision_windows_msvc_llvm.ps1 -Architecture x64
      - name: Provision matching LLVM dependencies and audit CRT
        shell: pwsh
        run: ./tools/provision_windows_msvc_libxml2.ps1 -Architecture x64
      - name: Verify native host and enabled LLVM backends
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") { throw "Expected native x64 Windows" }
          $hostLine = (rustc -vV | Select-String '^host: ').Line
          if ($LASTEXITCODE -ne 0 -or $hostLine -ne "host: x86_64-pc-windows-msvc") { throw "Wrong Rust host" }
          if (($env:PATH -split ';' | Where-Object { $_ -match '(?i)mingw|msys' }).Count -gt 0) { throw "Native MSVC validation must not inherit MinGW/MSYS paths" }
          Write-Host "LLVM config: $env:LLVM_CONFIG_PATH"
          Write-Host "MSVC linker: $((Get-Command link.exe).Source)"
          $targets = & $env:LLVM_CONFIG_PATH --targets-built
          if ($LASTEXITCODE -ne 0) { throw "LLVM backend probe failed" }
          foreach ($backend in @("X86", "AArch64", "RISCV")) {
            if (($targets -split '\s+') -notcontains $backend) { throw "Missing LLVM backend $backend" }
          }
          Write-Host "Native compiler uses x64 MSVC; enabled backends: $targets"
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check all native targets
        run: >-
          cargo check --locked --workspace --all-targets --target x86_64-pc-windows-msvc
          --no-default-features --features llvm-target-core64 --jobs 2
      - name: Run Clippy
        run: >-
          cargo clippy --locked --workspace --all-targets --target x86_64-pc-windows-msvc
          --no-default-features --features llvm-target-core64 --jobs 2 -- -D warnings
      - name: Build release compiler
        id: native_build
        run: >-
          cargo build --locked --release --target x86_64-pc-windows-msvc
          --no-default-features --features llvm-target-core64 --jobs 2
      - name: Run native hosted MSVC and bidirectional C ABI fixtures
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        id: msvc_native
        timeout-minutes: 20
        run: >-
          python tools/check_msvc_native.py
          --wavec target/x86_64-pc-windows-msvc/release/wavec.exe
          --llvm-bin "$env:WAVE_WINDOWS_LLVM_BIN"
          --target x86_64-pc-windows-msvc
          --output "${{ runner.temp }}/wave-msvc-native-x64"
      - name: Preserve native MSVC execution evidence
        if: ${{ always() && steps.msvc_native.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: msvc-native-x64-evidence
          path: ${{ runner.temp }}/wave-msvc-native-x64/
          retention-days: 7

      - name: Verify native LLVM allocation and target-data lifetimes
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: >-
          cargo test --locked --no-fail-fast --release -p llvm --test message_ownership
          --target x86_64-pc-windows-msvc --no-default-features
          --features llvm-target-core64 --jobs 2
      - name: Run native Rust and I/O regressions
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: >-
          cargo test --locked --no-fail-fast --workspace --all-targets --target x86_64-pc-windows-msvc
          --no-default-features --features llvm-target-core64 --jobs 2
      - name: Check MSVC package tool inventory
        if: ${{ !cancelled() && steps.python_setup.outcome == 'success' }}
        run: python -m unittest tools.test_msvc_package_tools

      - name: Install Wave standard library
        id: stdlib
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $libraryRoot = Join-Path $HOME ".wave/lib/wave"
          New-Item -ItemType Directory -Force -Path $libraryRoot | Out-Null
          Copy-Item -Path std -Destination (Join-Path $libraryRoot "std") -Recurse -Force
      - name: Check and run standard library examples
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' && steps.stdlib.outcome == 'success' }}
        run: >-
          python tools/check_wave_corpus.py --wavec target/x86_64-pc-windows-msvc/release/wavec.exe
          --run-std-examples
      - name: Validate Windows Python tooling
        if: ${{ !cancelled() && steps.python_setup.outcome == 'success' }}
        run: >-
          python -m unittest tools.test_check_case_sources tools.test_case_execution
          tools.test_case_manifest tools.test_test_contracts tools.test_process_tree
      - name: Check PE dependency failures and case runner selection
        if: ${{ !cancelled() && steps.python_setup.outcome == 'success' }}
        run: python -m unittest tools.test_windows_package tools.test_msvc_package_tools tools.test_run_tests
      - name: Stage native MSVC release package
        id: package_stage
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: python x.py package x86_64-pc-windows-msvc
      - name: Verify extracted package in a controlled environment
        if: ${{ !cancelled() && steps.package_stage.outcome == 'success' }}
        id: package_smoke
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archives = @(Get-ChildItem "wave-v*-x86_64-pc-windows-msvc.zip")
          if ($archives.Count -ne 1) { throw "Expected exactly one package" }
          python tools/check_msvc_package.py --archive $archives[0].FullName `
            --target x86_64-pc-windows-msvc --output "${{ runner.temp }}/wave-package-x64"
          if ($LASTEXITCODE -ne 0) { throw "Extracted package validation failed" }
      - name: Preserve package acceptance evidence
        if: ${{ always() && steps.package_smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: msvc-package-x64-evidence
          path: ${{ runner.temp }}/wave-package-x64/
          retention-days: 7

  build-windows-arm64:
    name: Build Windows arm64 (MSVC)
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 90
    env:
      CARGO_PROFILE_RELEASE_DEBUG: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy

      # The pinned ARM64 LLDB links against Python 3.11.
      - uses: actions/setup-python@v5
        id: python_setup
        with:
          python-version: "3.11"
          architecture: "arm64"

      - name: Install pinned native LLVM 21
        shell: pwsh
        run: ./tools/provision_windows_msvc_llvm.ps1 -Architecture arm64

      - name: Provision pinned ARM64 libxml2 for LLVM
        shell: pwsh
        run: ./tools/provision_windows_arm64_libxml2.ps1

      - name: Verify native toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:PROCESSOR_ARCHITECTURE -ne "ARM64") { throw "Expected an ARM64 runner" }
          if ((rustc -vV | Select-String '^host: ').Line -ne "host: aarch64-pc-windows-msvc") {
            throw "Rust is not using the native Windows ARM64 host toolchain"
          }
          & "$env:LLVM_CONFIG_PATH" --version

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy for the ARM64 compiler
        run: >-
          cargo clippy --locked --target aarch64-pc-windows-msvc
          --all-targets --no-default-features --features llvm-target-aarch64
          --jobs 2 -- -D warnings

      - name: Build native ARM64 compiler
        id: native_build
        run: >-
          cargo build --locked --release --target aarch64-pc-windows-msvc
          --no-default-features --features llvm-target-aarch64 --jobs 2

      - name: Run native hosted MSVC and bidirectional C ABI fixtures
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        id: msvc_native
        timeout-minutes: 20
        run: >-
          python tools/check_msvc_native.py
          --wavec target/aarch64-pc-windows-msvc/release/wavec.exe
          --llvm-bin "$env:WAVE_WINDOWS_LLVM_BIN"
          --target aarch64-pc-windows-msvc
          --output "${{ runner.temp }}/wave-msvc-native-arm64"
      - name: Preserve native MSVC execution evidence
        if: ${{ always() && steps.msvc_native.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: msvc-native-arm64-evidence
          path: ${{ runner.temp }}/wave-msvc-native-arm64/
          retention-days: 7

      - name: Verify native LLVM message allocator ownership
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: >-
          cargo test --locked --no-fail-fast --release -p llvm --test message_ownership
          --target aarch64-pc-windows-msvc --no-default-features
          --features llvm-target-aarch64 --jobs 2

      - name: Diagnose native ARM64 code generation
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        id: native_codegen
        timeout-minutes: 10
        run: >-
          python tools/diagnose_windows_arm64.py
          --wavec target/aarch64-pc-windows-msvc/release/wavec.exe
          --llvm-bin "$env:WAVE_WINDOWS_LLVM_BIN"
          --output "$env:RUNNER_TEMP/wave-arm64-diagnostics"

      - name: Save native ARM64 crash diagnostics
        if: ${{ failure() && steps.native_codegen.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-codegen-diagnostics
          path: |
            ${{ runner.temp }}/wave-arm64-diagnostics/
            target/aarch64-pc-windows-msvc/release/wavec.exe
            target/aarch64-pc-windows-msvc/release/wavec.pdb
          retention-days: 7

      - name: Check native Windows process supervision
        if: ${{ !cancelled() && steps.python_setup.outcome == 'success' }}
        run: python -m unittest tools.test_check_case_sources tools.test_case_execution tools.test_process_tree

      - name: Run native ARM64 unit and frontend driver tests
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: >-
          cargo test --locked --no-fail-fast --lib --test frontend_regressions --target aarch64-pc-windows-msvc
          --no-default-features --features llvm-target-aarch64 --jobs 2

      - name: Check native MSVC companion artifact publication
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: >-
          cargo test --locked --no-fail-fast --test codegen_regressions --target aarch64-pc-windows-msvc
          --no-default-features --features llvm-target-aarch64 --jobs 2
          msvc_link_companions_keep_final_names_and_survive_failed_replacement

      - name: Run native ARM64 filesystem error and Unicode regressions
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: >-
          cargo test --locked --test codegen_regressions --target aarch64-pc-windows-msvc
          --no-default-features --features llvm-target-aarch64 --jobs 2
          windows_filesystem_errors_and_unicode_paths_use_native_apis

      - name: Run native ARM64 MSVC executor restart regression
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        id: native_runtime
        env:
          WAVE_RUNTIME_ARTIFACT_DIR: ${{ runner.temp }}
        run: >-
          cargo test --locked --no-fail-fast --test runtime_regressions --test std_io_regressions --target aarch64-pc-windows-msvc
          --no-default-features --features llvm-target-aarch64 --jobs 2

      - name: Save failed native runtime compiler and fixture
        if: ${{ failure() && steps.native_runtime.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-runtime-failure
          path: |
            target/aarch64-pc-windows-msvc/debug/wavec.exe
            target/aarch64-pc-windows-msvc/debug/wavec.pdb
            ${{ runner.temp }}/wave-runtime-*/
          retention-days: 7

      - name: Install Wave stdlib
        id: stdlib
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $libraryRoot = Join-Path $HOME ".wave\lib\wave"
          New-Item -ItemType Directory -Force -Path $libraryRoot | Out-Null
          Copy-Item -Path std -Destination (Join-Path $libraryRoot "std") -Recurse

      - name: Validate native compiler and default target
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' && steps.stdlib.outcome == 'success' }}
        shell: pwsh
        env:
          WAVE_CODEGEN_TRACE: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $compiler = "target\aarch64-pc-windows-msvc\release\wavec.exe"
          $bytes = [System.IO.File]::ReadAllBytes($compiler)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0xaa64) {
            throw "wavec.exe is not an ARM64 PE image"
          }
          & $compiler -V
          if ($LASTEXITCODE -ne 0) { throw "Compiler version probe failed: $LASTEXITCODE" }
          $defaultTarget = & $compiler print default-target
          if ($LASTEXITCODE -ne 0) { throw "Default target probe failed: $LASTEXITCODE" }
          if ($defaultTarget -ne "aarch64-pc-windows-msvc") {
            throw "Unexpected native Windows ARM64 default target"
          }

          $output = Join-Path $env:RUNNER_TEMP "wave-arm64-object"
          & $compiler build tests/cases/windows/arm64/test1.wave `
            --emit=obj --out-dir $output
          if ($LASTEXITCODE -ne 0) { throw "Default MSVC object compilation failed: $LASTEXITCODE" }
          $object = [System.IO.File]::ReadAllBytes((Join-Path $output "test1.o"))
          if ([BitConverter]::ToUInt16($object, 0) -ne 0xaa64) {
            throw "Wave did not emit an ARM64 COFF object"
          }

      - name: Validate explicit native ARM64 MSVC object output
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' && steps.stdlib.outcome == 'success' }}
        shell: pwsh
        env:
          WAVE_CODEGEN_TRACE: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $compiler = "target\aarch64-pc-windows-msvc\release\wavec.exe"
          $output = Join-Path $env:RUNNER_TEMP "wave-arm64-msvc-object"
          & $compiler build tests/cases/windows/arm64/test1.wave `
            --target=aarch64-pc-windows-msvc --emit=obj --out-dir $output
          if ($LASTEXITCODE -ne 0) { throw "MSVC object compilation failed" }
          $object = [System.IO.File]::ReadAllBytes((Join-Path $output "test1.o"))
          if ([BitConverter]::ToUInt16($object, 0) -ne 0xaa64) {
            throw "MSVC target did not emit an ARM64 COFF object"
          }
      - name: Check PE dependency failures and case runner selection
        if: ${{ !cancelled() && steps.python_setup.outcome == 'success' }}
        run: python -m unittest tools.test_windows_package tools.test_msvc_package_tools tools.test_run_tests
      - name: Stage native MSVC release package
        id: package_stage
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: python x.py package aarch64-pc-windows-msvc
      - name: Verify extracted package in a controlled environment
        if: ${{ !cancelled() && steps.package_stage.outcome == 'success' }}
        id: package_smoke
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archives = @(Get-ChildItem "wave-v*-aarch64-pc-windows-msvc.zip")
          if ($archives.Count -ne 1) { throw "Expected exactly one package" }
          python tools/check_msvc_package.py --archive $archives[0].FullName `
            --target aarch64-pc-windows-msvc --output "${{ runner.temp }}/wave-package-arm64"
          if ($LASTEXITCODE -ne 0) { throw "Extracted package validation failed" }
      - name: Preserve package acceptance evidence
        if: ${{ always() && steps.package_smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: msvc-package-arm64-evidence
          path: ${{ runner.temp }}/wave-package-arm64/
          retention-days: 7

  build-wasm:
    name: Build WebAssembly wasm32+wasm64
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Install LLVM 21 and WebAssembly linker
        run: |
          sudo apt-get update
          sudo apt-get install -y wget software-properties-common
          wget --inet4-only --tries=3 --timeout=30 --retry-on-host-error --retry-connrefused https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y lld-21
          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG_PATH=/usr/lib/llvm-21/bin/llvm-config" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"

      - name: Install Wave stdlib
        run: |
          mkdir -p "$HOME/.wave/lib/wave"
          rm -rf "$HOME/.wave/lib/wave/std"
          cp -R std "$HOME/.wave/lib/wave/std"

      - name: Verify WebAssembly tools
        run: |
          set -euo pipefail

          llvm-config --version
          wasm-ld --version
          llvm-readobj --version
          node --version

      - name: Build compiler with the WebAssembly backend only
        run: >-
          cargo build --locked --release --no-default-features
          --features llvm-target-wasm --jobs 2

      - name: Run WebAssembly compiler regressions
        run: >-
          cargo test --locked --no-default-features
          --features llvm-target-wasm --test codegen_regressions
          webassembly_ --jobs 2 --verbose

      - name: Build and run browser and WASI modules
        run: |
          set -euo pipefail

          output_dir="$RUNNER_TEMP/wave-wasm32"
          target/release/wavec build examples/wasm_module.wave \
            --target wasm32-unknown-unknown \
            --out-dir "$output_dir"
          llvm-readobj --file-headers "$output_dir/wasm_module.wasm" \
            | grep -F 'Format: WASM'
          node tools/run_wasm_smoke.mjs "$output_dir/wasm_module.wasm"
          target/release/wavec run examples/wasm_run.wave \
            --target wasm32-unknown-unknown

          target/release/wavec build examples/wasm_wasi.wave \
            --target wasm32-wasip1 \
            --out-dir "$output_dir"
          llvm-readobj --file-headers "$output_dir/wasm_wasi.wasm" \
            | grep -F 'Format: WASM'
          node --no-warnings tools/run_wasi_smoke.mjs \
            "$output_dir/wasm_wasi.wasm" "$GITHUB_WORKSPACE"
          target/release/wavec run examples/wasm_wasi.wave \
            --target wasm32-wasip1
