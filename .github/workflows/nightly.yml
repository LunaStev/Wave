# SPDX-License-Identifier: MPL-2.0
name: Wave Nightly
'on':
  workflow_run:
    workflows:
    - Wave CI
    types:
    - completed
    branches:
    - master
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful canonical master Wave CI run ID to retry
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  NO_COLOR: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  gate:
    if: >-
      ${{ github.repository == 'wavefnd/Wave' &&
          ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
           (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_repository.full_name == 'wavefnd/Wave' &&
            github.event.workflow_run.head_branch == 'master')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.gate.outputs.source_sha }}
      compiler_version: ${{ steps.gate.outputs.compiler_version }}
      ci_run_id: ${{ steps.gate.outputs.ci_run_id }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: master
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Validate canonical CI source and installer deployment
      id: gate
      env:
        GH_TOKEN: ${{ github.token }}
        WAVE_NIGHTLY_CI_RUN: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
      run: python -m tools.ci.release --channel nightly --stage gate
  package-linux:
    name: Package Linux ${{ matrix.arch == 'x86_64' && 'amd64' || matrix.arch }}
    needs:
    - gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          runner: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
          archive_target: x86_64-linux-gnu
        - arch: arm64
          runner: ubuntu-24.04-arm
          target: aarch64-unknown-linux-gnu
          archive_target: aarch64-linux-gnu
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.gate.outputs.source_sha }}
        persist-credentials: false
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Build and validate Nightly package
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix) }}
        GH_TOKEN: ${{ github.token }}
      run: python -m tools.ci.release --channel nightly --stage package --target "${{ matrix.target }}" --provision --report-json
        ci-report.json
    - uses: actions/upload-artifact@v4
      with:
        name: nightly-linux-${{ matrix.arch }}
        path: 'wave-v${{ needs.gate.outputs.compiler_version }}-${{ matrix.archive_target }}.tar.gz

          wave-v${{ needs.gate.outputs.compiler_version }}-${{ matrix.archive_target }}.tar.gz.sha256

          wave-v${{ needs.gate.outputs.compiler_version }}-${{ matrix.archive_target }}.tar.gz.metadata.json

          '
        if-no-files-found: error
        retention-days: 7
    - name: Upload procedure report and command logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: procedures-nightly-package-linux-${{ matrix.arch }}
        path: 'ci-report.json

          ${{ runner.temp }}/wave-ci-*/*.log

          '
        if-no-files-found: warn
        retention-days: 7
    env:
      RELEASE_VERSION: ${{ needs.gate.outputs.compiler_version }}
      WAVE_NIGHTLY_CI_RUN: ${{ needs.gate.outputs.ci_run_id }}
  package-linux-loongarch64:
    name: Package Linux loong64 (cross)
    needs:
    - gate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.gate.outputs.source_sha }}
        persist-credentials: false
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - name: Enable LoongArch64 compiler execution
      uses: docker/setup-qemu-action@v3
      with:
        platforms: loong64
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Build and validate Nightly package
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix) }}
        GH_TOKEN: ${{ github.token }}
      run: python -m tools.ci.release --channel nightly --stage package --target "linux-loong64" --provision --report-json
        ci-report.json
    - uses: actions/upload-artifact@v4
      with:
        name: nightly-linux-loongarch64
        path: 'wave-v${{ needs.gate.outputs.compiler_version }}-loongarch64-linux-gnu.tar.gz

          wave-v${{ needs.gate.outputs.compiler_version }}-loongarch64-linux-gnu.tar.gz.sha256

          wave-v${{ needs.gate.outputs.compiler_version }}-loongarch64-linux-gnu.tar.gz.metadata.json

          '
        if-no-files-found: error
        retention-days: 7
    - name: Upload procedure report and command logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: procedures-nightly-package-linux-loongarch64-single
        path: 'ci-report.json

          ${{ runner.temp }}/wave-ci-*/*.log

          '
        if-no-files-found: warn
        retention-days: 7
    env:
      RELEASE_VERSION: ${{ needs.gate.outputs.compiler_version }}
      WAVE_NIGHTLY_CI_RUN: ${{ needs.gate.outputs.ci_run_id }}
  package-linux-riscv64:
    name: Package Linux riscv64 (cross build, QEMU smoke)
    needs:
    - gate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.gate.outputs.source_sha }}
        persist-credentials: false
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - name: Cache Cargo build inputs
      uses: actions/cache@v4
      with:
        path: '~/.cargo/registry

          ~/.cargo/git

          target/riscv64gc-unknown-linux-gnu'
        key: nightly-cargo-riscv64-${{ hashFiles('Cargo.lock', 'tools/ci/toolchains.json', 'tools/ci/cross_package.py')
          }}-${{ github.sha }}
        restore-keys: nightly-cargo-riscv64-${{ hashFiles('Cargo.lock', 'tools/ci/toolchains.json', 'tools/ci/cross_package.py')
          }}-
    - name: Enable RISC-V container execution
      uses: docker/setup-qemu-action@v3
      with:
        platforms: riscv64
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Build and validate Nightly package
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix) }}
        GH_TOKEN: ${{ github.token }}
      run: python -m tools.ci.release --channel nightly --stage package --target "linux-riscv64" --provision --report-json
        ci-report.json
    - uses: actions/upload-artifact@v4
      with:
        name: nightly-linux-riscv64
        path: 'wave-v${{ needs.gate.outputs.compiler_version }}-riscv64-linux-gnu.tar.gz

          wave-v${{ needs.gate.outputs.compiler_version }}-riscv64-linux-gnu.tar.gz.sha256

          wave-v${{ needs.gate.outputs.compiler_version }}-riscv64-linux-gnu.tar.gz.metadata.json

          '
        if-no-files-found: error
        retention-days: 7
    - name: Upload procedure report and command logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: procedures-nightly-package-linux-riscv64-single
        path: 'ci-report.json

          ${{ runner.temp }}/wave-ci-*/*.log

          '
        if-no-files-found: warn
        retention-days: 7
    env:
      RELEASE_VERSION: ${{ needs.gate.outputs.compiler_version }}
      WAVE_NIGHTLY_CI_RUN: ${{ needs.gate.outputs.ci_run_id }}
  package-macos:
    name: Package macOS ${{ matrix.arch == 'x86_64' && 'amd64' || matrix.arch }}
    needs:
    - gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          runner: macos-15-intel
          target: x86_64-apple-darwin
        - arch: arm64
          runner: macos-15
          target: aarch64-apple-darwin
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.gate.outputs.source_sha }}
        persist-credentials: false
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Build and validate Nightly package
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix) }}
        GH_TOKEN: ${{ github.token }}
      run: python -m tools.ci.release --channel nightly --stage package --target "${{ matrix.target }}" --provision --report-json
        ci-report.json
    - uses: actions/upload-artifact@v4
      with:
        name: nightly-macos-${{ matrix.arch }}
        path: 'wave-v${{ needs.gate.outputs.compiler_version }}-${{ matrix.target }}.tar.gz

          wave-v${{ needs.gate.outputs.compiler_version }}-${{ matrix.target }}.tar.gz.sha256

          wave-v${{ needs.gate.outputs.compiler_version }}-${{ matrix.target }}.tar.gz.metadata.json

          '
        if-no-files-found: error
        retention-days: 7
    - name: Upload procedure report and command logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: procedures-nightly-package-macos-${{ matrix.arch }}
        path: 'ci-report.json

          ${{ runner.temp }}/wave-ci-*/*.log

          '
        if-no-files-found: warn
        retention-days: 7
    env:
      RELEASE_VERSION: ${{ needs.gate.outputs.compiler_version }}
      WAVE_NIGHTLY_CI_RUN: ${{ needs.gate.outputs.ci_run_id }}
  package-windows:
    name: Package Windows amd64 (MSVC)
    needs:
    - gate
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.gate.outputs.source_sha }}
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@1.89.0
      with:
        toolchain: 1.89.0-x86_64-pc-windows-msvc
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: x64
    - name: Build and validate Nightly package
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix) }}
        GH_TOKEN: ${{ github.token }}
      run: python -m tools.ci.release --channel nightly --stage package --target "windows-amd64" --provision --report-json
        ci-report.json
    - name: Preserve native execution evidence
      if: ${{ always() && steps.procedure.outputs.native_acceptance != 'skipped' }}
      uses: actions/upload-artifact@v4
      with:
        name: msvc-native-x64-evidence
        path: ${{ runner.temp }}/wave-msvc-native-x64/
        retention-days: 7
    - name: Preserve case evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: wave-cases-windows-amd64
        path: wave-cases-windows-amd64.json
    - name: Preserve package acceptance evidence
      if: ${{ always() && steps.procedure.outputs.package_smoke != 'skipped' }}
      uses: actions/upload-artifact@v4
      with:
        name: msvc-package-x64-evidence
        path: ${{ runner.temp }}/wave-package-x64/
        retention-days: 7
    - uses: actions/upload-artifact@v4
      with:
        name: nightly-windows-x64
        path: 'wave-v${{ needs.gate.outputs.compiler_version }}-x86_64-pc-windows-msvc.zip

          wave-v${{ needs.gate.outputs.compiler_version }}-x86_64-pc-windows-msvc.zip.sha256

          wave-v${{ needs.gate.outputs.compiler_version }}-x86_64-pc-windows-msvc.zip.metadata.json

          '
        if-no-files-found: error
    - name: Upload procedure report and command logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: procedures-nightly-package-windows-single
        path: 'ci-report.json

          ${{ runner.temp }}/wave-ci-*/*.log

          '
        if-no-files-found: warn
        retention-days: 7
    env:
      RELEASE_VERSION: ${{ needs.gate.outputs.compiler_version }}
      WAVE_NIGHTLY_CI_RUN: ${{ needs.gate.outputs.ci_run_id }}
  package-windows-arm64:
    name: Package Windows arm64 (MSVC)
    needs:
    - gate
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.gate.outputs.source_sha }}
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@1.89.0
      with:
        toolchain: 1.89.0-aarch64-pc-windows-msvc
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: arm64
    - name: Build and validate Nightly package
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix) }}
        GH_TOKEN: ${{ github.token }}
      run: python -m tools.ci.release --channel nightly --stage package --target "windows-arm64" --provision --report-json
        ci-report.json
    - name: Preserve native execution evidence
      if: ${{ always() && steps.procedure.outputs.native_acceptance != 'skipped' }}
      uses: actions/upload-artifact@v4
      with:
        name: msvc-native-arm64-evidence
        path: ${{ runner.temp }}/wave-msvc-native-arm64/
        retention-days: 7
    - name: Preserve case evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: wave-cases-windows-arm64
        path: wave-cases-windows-arm64.json
    - name: Preserve package acceptance evidence
      if: ${{ always() && steps.procedure.outputs.package_smoke != 'skipped' }}
      uses: actions/upload-artifact@v4
      with:
        name: msvc-package-arm64-evidence
        path: ${{ runner.temp }}/wave-package-arm64/
        retention-days: 7
    - uses: actions/upload-artifact@v4
      with:
        name: nightly-windows-arm64
        path: 'wave-v${{ needs.gate.outputs.compiler_version }}-aarch64-pc-windows-msvc.zip

          wave-v${{ needs.gate.outputs.compiler_version }}-aarch64-pc-windows-msvc.zip.sha256

          wave-v${{ needs.gate.outputs.compiler_version }}-aarch64-pc-windows-msvc.zip.metadata.json

          '
        if-no-files-found: error
    - name: Upload procedure report and command logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: procedures-nightly-package-windows-arm64-single
        path: 'ci-report.json

          ${{ runner.temp }}/wave-ci-*/*.log

          '
        if-no-files-found: warn
        retention-days: 7
    env:
      RELEASE_VERSION: ${{ needs.gate.outputs.compiler_version }}
      WAVE_NIGHTLY_CI_RUN: ${{ needs.gate.outputs.ci_run_id }}
  package-freebsd:
    name: Package FreeBSD amd64 (VM)
    needs:
    - gate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ needs.gate.outputs.source_sha }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Select FreeBSD VM cache
      id: freebsd-cache
      run: python3 -m tools.ci.freebsd_cache --github-output "$GITHUB_OUTPUT"
    - name: Restore FreeBSD tools and Cargo cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.freebsd-cache.outputs.path }}
        key: ${{ steps.freebsd-cache.outputs.key }}
        restore-keys: ${{ steps.freebsd-cache.outputs.restore-prefix }}
    - name: Build and validate FreeBSD package
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 -m tools.ci.release --channel nightly --stage package --target freebsd-amd64 --provision --report-json
        ci-report.json
    - uses: actions/upload-artifact@v4
      with:
        name: nightly-freebsd-amd64
        path: wave-v${{ needs.gate.outputs.compiler_version }}-x86_64-unknown-freebsd.tar.gz*
        if-no-files-found: error
        retention-days: 7
    - name: Upload procedure report and command logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: procedures-nightly-package-freebsd
        path: 'ci-report.json

          ${{ runner.temp }}/wave-ci-*/*.log'
        if-no-files-found: warn
        retention-days: 7
    env:
      RELEASE_VERSION: ${{ needs.gate.outputs.compiler_version }}
      WAVE_NIGHTLY_CI_RUN: ${{ needs.gate.outputs.ci_run_id }}
  publish:
    needs:
    - gate
    - package-linux
    - package-linux-loongarch64
    - package-linux-riscv64
    - package-macos
    - package-windows
    - package-windows-arm64
    - package-freebsd
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    concurrency:
      group: wave-nightly-publish
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.gate.outputs.source_sha }}
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@v4
      with:
        pattern: nightly-*
        path: release-assets
        merge-multiple: true
    - name: Promote the complete Nightly generation
      env:
        GH_TOKEN: ${{ github.token }}
        WAVE_NIGHTLY_CI_RUN: ${{ needs.gate.outputs.ci_run_id }}
      run: python -m tools.ci.release --channel nightly --stage publish --publish
