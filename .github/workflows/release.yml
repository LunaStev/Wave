# SPDX-License-Identifier: MPL-2.0
name: Wave Release
permissions:
  contents: read
concurrency:
  group: manual-release-${{ inputs.version }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  NO_COLOR: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  RELEASE_VERSION: ${{ inputs.version }}
jobs:
  validate:
    name: Validate Linux amd64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
      with:
        components: rustfmt, clippy
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Run release procedures
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix) }}
        WAVE_RELEASE_INPUTS: ${{ toJSON(inputs) }}
      run: python3 -m tools.ci.release --target "linux-amd64" --lane release/validate --provision --report-json ci-report.json
    - name: Upload Wave end-to-end report
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: release-validation-e2e
        path: |
          wave-e2e-report.json
        if-no-files-found: warn
        retention-days: 7
    - name: Upload procedure report and command logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: procedures-release-validate-single
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
  validate-loongarch64:
    name: Validate Linux loong64 (cross)
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Run release procedures
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix) }}
        WAVE_RELEASE_INPUTS: ${{ toJSON(inputs) }}
      run: python3 -m tools.ci.release --target "linux-loong64" --lane release/validate-loongarch64 --provision --report-json ci-report.json
    - name: Upload procedure report and command logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: procedures-release-validate-loongarch64-single
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
  validate-riscv64:
    name: Validate Linux riscv64 (cross)
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Run release procedures
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix) }}
        WAVE_RELEASE_INPUTS: ${{ toJSON(inputs) }}
      run: python3 -m tools.ci.release --target "linux-riscv64" --lane release/validate-riscv64 --provision --report-json ci-report.json
    - name: Upload procedure report and command logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: procedures-release-validate-riscv64-single
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
  package-linux:
    name: Package Linux ${{ matrix.arch == 'x86_64' && 'amd64' || matrix.arch }}
    needs:
    - validate
    - validate-riscv64
    - validate-loongarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          runner: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
          archive_target: x86_64-linux-gnu
        - arch: arm64
          runner: ubuntu-24.04-arm
          target: aarch64-unknown-linux-gnu
          archive_target: aarch64-linux-gnu
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Run release procedures
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix) }}
        WAVE_RELEASE_INPUTS: ${{ toJSON(inputs) }}
      run: python3 -m tools.ci.release --target "${{ matrix.target }}" --lane release/package-linux --provision --report-json ci-report.json
    - uses: actions/upload-artifact@v4
      with:
        name: release-linux-${{ matrix.arch }}
        path: |
          wave-v${{ inputs.version }}-${{ matrix.archive_target }}.tar.gz
          wave-v${{ inputs.version }}-${{ matrix.archive_target }}.tar.gz.sha256
          wave-v${{ inputs.version }}-${{ matrix.archive_target }}.tar.gz.metadata.json
        if-no-files-found: error
        retention-days: 7
    - name: Upload procedure report and command logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: procedures-release-package-linux-${{ matrix.arch }}
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
  package-linux-loongarch64:
    name: Package Linux loong64 (cross)
    needs:
    - validate
    - validate-riscv64
    - validate-loongarch64
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - name: Enable LoongArch64 compiler execution
      uses: docker/setup-qemu-action@v3
      with:
        platforms: loong64
    - name: Cache cross-built LoongArch64 LLVM
      uses: actions/cache@v4
      with:
        path: /tmp/wave-loongarch64-release
        key: loongarch64-llvm-${{ runner.os }}-${{ hashFiles('tools/ci/toolchains.json') }}-${{ hashFiles('tools/package_linux_loongarch64.sh') }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Run release procedures
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix) }}
        WAVE_RELEASE_INPUTS: ${{ toJSON(inputs) }}
      run: python3 -m tools.ci.release --target "linux-loong64" --lane release/package-linux-loongarch64 --provision --report-json ci-report.json
    - uses: actions/upload-artifact@v4
      with:
        name: release-linux-loongarch64
        path: |
          wave-v${{ inputs.version }}-loongarch64-linux-gnu.tar.gz
          wave-v${{ inputs.version }}-loongarch64-linux-gnu.tar.gz.sha256
          wave-v${{ inputs.version }}-loongarch64-linux-gnu.tar.gz.metadata.json
        if-no-files-found: error
        retention-days: 7
    - name: Upload procedure report and command logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: procedures-release-package-linux-loongarch64-single
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
  package-linux-riscv64:
    name: Package Linux riscv64 (cross build, QEMU smoke)
    needs:
    - validate
    - validate-riscv64
    - validate-loongarch64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - name: Cache RISC-V LLVM distribution
      uses: actions/cache@v4
      with:
        path: '/tmp/wave-riscv64-release/llvm-build/bin

          /tmp/wave-riscv64-release/llvm-build/lib

          /tmp/wave-riscv64-release/llvm-build/include

          /tmp/wave-riscv64-release/toolchain.json'
        key: riscv64-llvm-${{ runner.os }}-${{ hashFiles('tools/ci/toolchains.json', 'tools/ci/cross_package.py')
          }}
    - name: Cache Cargo build inputs
      uses: actions/cache@v4
      with:
        path: '~/.cargo/registry

          ~/.cargo/git

          target/riscv64gc-unknown-linux-gnu'
        key: release-cargo-riscv64-${{ hashFiles('Cargo.lock', 'tools/ci/toolchains.json', 'tools/ci/cross_package.py')
          }}-${{ github.sha }}
        restore-keys: release-cargo-riscv64-${{ hashFiles('Cargo.lock', 'tools/ci/toolchains.json', 'tools/ci/cross_package.py')
          }}-
    - name: Enable RISC-V container execution
      uses: docker/setup-qemu-action@v3
      with:
        platforms: riscv64
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Run release procedures
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix) }}
        WAVE_RELEASE_INPUTS: ${{ toJSON(inputs) }}
      run: python3 -m tools.ci.release --target "linux-riscv64" --lane release/package-linux-riscv64 --provision
        --report-json ci-report.json
    - uses: actions/upload-artifact@v4
      with:
        name: release-linux-riscv64
        path: 'wave-v${{ inputs.version }}-riscv64-linux-gnu.tar.gz

          wave-v${{ inputs.version }}-riscv64-linux-gnu.tar.gz.sha256

          wave-v${{ inputs.version }}-riscv64-linux-gnu.tar.gz.metadata.json

          '
        if-no-files-found: error
        retention-days: 7
    - name: Upload procedure report and command logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: procedures-release-package-linux-riscv64-single
        path: 'ci-report.json

          ${{ runner.temp }}/wave-ci-*/*.log

          '
        if-no-files-found: warn
        retention-days: 7
  package-macos:
    name: Package macOS ${{ matrix.arch == 'x86_64' && 'amd64' || matrix.arch }}
    needs:
    - validate
    - validate-riscv64
    - validate-loongarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          runner: macos-15-intel
          target: x86_64-apple-darwin
        - arch: arm64
          runner: macos-15
          target: aarch64-apple-darwin
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Run release procedures
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix) }}
        WAVE_RELEASE_INPUTS: ${{ toJSON(inputs) }}
      run: python3 -m tools.ci.release --target "${{ matrix.target }}" --lane release/package-macos --provision --report-json ci-report.json
    - uses: actions/upload-artifact@v4
      with:
        name: release-macos-${{ matrix.arch }}
        path: |
          wave-v${{ inputs.version }}-${{ matrix.target }}.tar.gz
          wave-v${{ inputs.version }}-${{ matrix.target }}.tar.gz.sha256
          wave-v${{ inputs.version }}-${{ matrix.target }}.tar.gz.metadata.json
        if-no-files-found: error
        retention-days: 7
    - name: Upload procedure report and command logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: procedures-release-package-macos-${{ matrix.arch }}
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
  package-windows:
    name: Package Windows amd64 (MSVC)
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.89.0
      with:
        toolchain: 1.89.0-x86_64-pc-windows-msvc
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: x64
    - name: Run release procedures
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix) }}
        WAVE_RELEASE_INPUTS: ${{ toJSON(inputs) }}
      run: python -m tools.ci.release --target "windows-amd64" --lane release/package-windows --provision --report-json ci-report.json
    - name: Preserve native execution evidence
      if: ${{ always() && steps.procedure.outputs.native_acceptance != 'skipped' }}
      uses: actions/upload-artifact@v4
      with:
        name: msvc-native-x64-evidence
        path: ${{ runner.temp }}/wave-msvc-native-x64/
        retention-days: 7
    - name: Preserve case evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: wave-cases-windows-amd64
        path: wave-cases-windows-amd64.json
    - name: Preserve package acceptance evidence
      if: ${{ always() && steps.procedure.outputs.package_smoke != 'skipped' }}
      uses: actions/upload-artifact@v4
      with:
        name: msvc-package-x64-evidence
        path: ${{ runner.temp }}/wave-package-x64/
        retention-days: 7
    - uses: actions/upload-artifact@v4
      with:
        name: release-windows-x64
        path: |
          wave-v${{ inputs.version }}-x86_64-pc-windows-msvc.zip
          wave-v${{ inputs.version }}-x86_64-pc-windows-msvc.zip.sha256
          wave-v${{ inputs.version }}-x86_64-pc-windows-msvc.zip.metadata.json
        if-no-files-found: error
    - name: Upload procedure report and command logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: procedures-release-package-windows-single
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
  package-windows-arm64:
    name: Package Windows arm64 (MSVC)
    needs: validate
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.89.0
      with:
        toolchain: 1.89.0-aarch64-pc-windows-msvc
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: arm64
    - name: Run release procedures
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix) }}
        WAVE_RELEASE_INPUTS: ${{ toJSON(inputs) }}
      run: python -m tools.ci.release --target "windows-arm64" --lane release/package-windows-arm64 --provision --report-json ci-report.json
    - name: Preserve native execution evidence
      if: ${{ always() && steps.procedure.outputs.native_acceptance != 'skipped' }}
      uses: actions/upload-artifact@v4
      with:
        name: msvc-native-arm64-evidence
        path: ${{ runner.temp }}/wave-msvc-native-arm64/
        retention-days: 7
    - name: Preserve case evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: wave-cases-windows-arm64
        path: wave-cases-windows-arm64.json
    - name: Preserve package acceptance evidence
      if: ${{ always() && steps.procedure.outputs.package_smoke != 'skipped' }}
      uses: actions/upload-artifact@v4
      with:
        name: msvc-package-arm64-evidence
        path: ${{ runner.temp }}/wave-package-arm64/
        retention-days: 7
    - uses: actions/upload-artifact@v4
      with:
        name: release-windows-arm64
        path: |
          wave-v${{ inputs.version }}-aarch64-pc-windows-msvc.zip
          wave-v${{ inputs.version }}-aarch64-pc-windows-msvc.zip.sha256
          wave-v${{ inputs.version }}-aarch64-pc-windows-msvc.zip.metadata.json
        if-no-files-found: error
    - name: Upload procedure report and command logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: procedures-release-package-windows-arm64-single
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
  package-freebsd:
    name: Package FreeBSD amd64 (VM)
    needs:
    - validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Build and validate FreeBSD package
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 -m tools.ci.package --target freebsd-amd64 --provision --report-json ci-report.json
    - uses: actions/upload-artifact@v4
      with:
        name: release-freebsd-amd64
        path: wave-v${{ inputs.version }}-x86_64-unknown-freebsd.tar.gz*
        if-no-files-found: error
        retention-days: 7
    - name: Upload procedure report and command logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: procedures-release-package-freebsd
        path: 'ci-report.json

          ${{ runner.temp }}/wave-ci-*/*.log'
        if-no-files-found: warn
        retention-days: 7
    env:
      RELEASE_VERSION: ${{ inputs.version }}
  publish:
    name: Publish release
    needs:
    - validate
    - validate-riscv64
    - validate-loongarch64
    - package-linux
    - package-linux-riscv64
    - package-linux-loongarch64
    - package-macos
    - package-windows
    - package-windows-arm64
    - package-freebsd
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@v4
      with:
        pattern: release-*
        path: release-assets
        merge-multiple: true
    - name: Run release procedures
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix) }}
        WAVE_RELEASE_INPUTS: ${{ toJSON(inputs) }}
        GH_TOKEN: ${{ github.token }}
      run: python3 -m tools.ci.release --target "linux-amd64" --lane release/publish --provision --report-json ci-report.json
        --publish
    - name: Upload procedure report and command logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: procedures-release-publish-single
        path: 'ci-report.json

          ${{ runner.temp }}/wave-ci-*/*.log

          '
        if-no-files-found: warn
        retention-days: 7
'on':
  workflow_dispatch:
    inputs:
      version:
        description: 'Cargo version without the v prefix (for example: 0.2.0-pre-beta)'
        required: true
        type: string
      draft:
        description: Create the GitHub release as a draft
        required: true
        default: true
        type: boolean
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: true
        type: boolean
