  publish:
    name: Create GitHub release
    needs: [validate, validate-riscv64, validate-loongarch64, package-linux, package-linux-riscv64, package-linux-loongarch64, package-macos, package-windows, package-windows-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail

          test -f "wave-v${RELEASE_VERSION}-x86_64-linux-gnu.tar.gz"
          test -f "wave-v${RELEASE_VERSION}-aarch64-linux-gnu.tar.gz"
          test -f "wave-v${RELEASE_VERSION}-riscv64-linux-gnu.tar.gz"
          test -f "wave-v${RELEASE_VERSION}-loongarch64-linux-gnu.tar.gz"
          test -f "wave-v${RELEASE_VERSION}-x86_64-pc-windows-msvc.zip"
          test -f "wave-v${RELEASE_VERSION}-aarch64-pc-windows-msvc.zip"
          test -f "wave-v${RELEASE_VERSION}-aarch64-apple-darwin.tar.gz"
          test -f "wave-v${RELEASE_VERSION}-x86_64-apple-darwin.tar.gz"

          for archive in *.tar.gz *.zip; do
            test -f "$archive.sha256"
          done

          cat ./*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="v$RELEASE_VERSION"

          args=(
            release create "$tag"
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/SHA256SUMS
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "Wave $tag"
            --generate-notes
          )

          if [[ "${{ inputs.draft }}" == "true" ]]; then
            args+=(--draft)
          fi

          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
