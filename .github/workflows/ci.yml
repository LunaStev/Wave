      uses: actions/upload-artifact@v4
      with:
        name: wave-cases-${{ matrix.id }}
        path: |
          wave-cases-${{ matrix.id }}-compile.json
          wave-cases-${{ matrix.id }}-runtime.json
        if-no-files-found: warn
    - name: Upload procedure report and command logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: procedures-cases-cases-loongarch64-${{ matrix.id }}
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
  cases-riscv64:
    name: Cases Linux ${{ matrix.arch }} (QEMU)
