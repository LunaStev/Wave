# SPDX-License-Identifier: MPL-2.0
name: Wave CI
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  PYTHONUNBUFFERED: '1'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
permissions:
  contents: read
concurrency:
  group: wave-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-linux-amd64:
    name: Build Linux amd64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
      with:
        components: rustfmt, clippy
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Run CI procedures
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix) }}
      run: python3 -m tools.ci.test --target "linux-amd64" --lane rust/build-linux-amd64 --provision --report-json ci-report.json
    - name: Upload procedure report and command logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: procedures-rust-build-linux-amd64-single
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
  build-linux-arm64:
    name: Build Linux arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
      with:
        components: rustfmt, clippy
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Run CI procedures
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix) }}
      run: python3 -m tools.ci.test --target "linux-arm64" --lane rust/build-linux-arm64 --provision --report-json ci-report.json
    - name: Upload procedure report and command logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: procedures-rust-build-linux-arm64-single
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
  build-linux-loongarch64:
    name: Build Linux loong64 (cross)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
      with:
        components: rustfmt, clippy
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Run CI procedures
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix) }}
      run: python3 -m tools.ci.test --target "linux-loong64" --lane rust/build-linux-loongarch64 --provision --report-json ci-report.json
    - name: Upload procedure report and command logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: procedures-rust-build-linux-loongarch64-single
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
  build-linux-riscv64:
    name: Build Linux riscv64 (cross)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
      with:
        components: rustfmt, clippy
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Run CI procedures
      id: procedure
      env:
        WAVE_CI_MATRIX: ${{ toJSON(matrix) }}
      run: python3 -m tools.ci.test --target "linux-riscv64" --lane rust/build-linux-riscv64 --provision --report-json ci-report.json
    - name: Upload procedure report and command logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: procedures-rust-build-linux-riscv64-single
        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
  build-macos-amd64:
    name: Build macOS amd64
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.89.0
      with:
        components: rustfmt, clippy
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Run CI procedures
      id: procedure
      env:
