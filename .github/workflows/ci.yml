        path: |
          ci-report.json
          ${{ runner.temp }}/wave-ci-*/*.log
        if-no-files-found: warn
        retention-days: 7
  cases-windows-arm64:
    name: Cases Windows ${{ matrix.arch }} (MSVC)
    needs: case-config
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.case-config.outputs.windows_arm64) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.89.0
      with:
